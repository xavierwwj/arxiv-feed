services:
  ingest:
    build: .
    command: python ingest_papers.py
    env_file: .env
    volumes:
      - "${LIGHTRAG_DIR}:/lightrag-db"
    environment:
      LIGHTRAG_DIR: /lightrag-db

  newsletter:
    build: .
    command: python arxiv_newsletter.py
    env_file: .env

  query:
    build: .
    entrypoint: ["python", "query_rag.py"]
    env_file: .env
    volumes:
      - "${LIGHTRAG_DIR}:/lightrag-db"
    environment:
      LIGHTRAG_DIR: /lightrag-db

  add-paper:
    build: .
    entrypoint: ["python", "add_paper.py"]
    env_file: .env
    volumes:
      - "${LIGHTRAG_DIR}:/lightrag-db"
    environment:
      LIGHTRAG_DIR: /lightrag-db

  visualize:
    build: .
    command: python visualize_graph.py
    env_file: .env
    volumes:
      - "${LIGHTRAG_DIR}:/lightrag-db"
    environment:
      LIGHTRAG_DIR: /lightrag-db
